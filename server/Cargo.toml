[package]
name = "guanqi"
version = "1.0.0"
description = "观棋 · 象棋研习室"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "guanqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
xcap = "0.5.1"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
